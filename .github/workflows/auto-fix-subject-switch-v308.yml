name: Auto fix V308 subject switch

on:
  push:
    branches: [ui-redesign-v308-main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-redesign-v308-main
          fetch-depth: 1
      - name: Patch app.py
        run: python scripts/fix_subject_switch.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if git diff --cached --quiet; then
            echo 'NO_CHANGE'
            exit 0
          fi
          git commit -m 'fix: unify Toan and Vat li subject switching'
          git push origin ui-redesign-v308-main
