name: Backup GitHub question bank

on:
  push:
    branches: [main]
    paths:
      - 'ngan-hang/**'
      - 'bank_index.json'
      - '.github/workflows/github-bank-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build backup archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup_out
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          SHORT="${GITHUB_SHA:0:12}"
          tar -czf "backup_out/github-bank-${TS}-${SHORT}.tar.gz" ngan-hang bank_index.json
          cp bank_index.json "backup_out/bank_index-${TS}-${SHORT}.json"
          printf 'source=GitHub/ngan-hang/*.tex\ncommit=%s\ncreated_utc=%s\n' "$GITHUB_SHA" "$TS" > backup_out/README.txt

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-bank-backup-${{ github.sha }}
          path: backup_out/
          retention-days: 30
