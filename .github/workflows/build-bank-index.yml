name: Build Bank Index

on:
  push:
    branches: [main]
    paths:
      - 'ngan-hang/**/*.tex'
      - 'scripts/build_bank_index.py'
      - '.github/workflows/build-bank-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bank index
        run: python scripts/build_bank_index.py
      - name: Commit bank index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bank_index.json
          if git diff --cached --quiet; then
            echo 'bank_index.json không thay đổi.'
          else
            git commit -m 'Auto update bank_index.json'
            git push
          fi
