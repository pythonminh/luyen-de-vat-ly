name: Fix V308 syntax

on:
  push:
    branches:
      - ui-redesign-v308-main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui-redesign-v308-main
          fetch-depth: 0

      - name: Fix malformed YouTube suffix and verify Python
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '"""https://youtube.com/'
          if old in s:
              s = s.replace(old, '"""')
              p.write_text(s, encoding='utf-8', newline='')
              print('Fixed malformed suffix in app.py')
          else:
              print('No malformed suffix found')
          PY
          python -m py_compile app.py

      - name: Commit fix if needed
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Fix V308 app.py syntax error'
          git push origin HEAD:ui-redesign-v308-main
