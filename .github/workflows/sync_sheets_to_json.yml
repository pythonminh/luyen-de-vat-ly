name: Sync Sheets to JSON Cache

on:
  schedule:
    # Chạy hàng ngày lúc 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-export even if no changes'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install gspread google-auth python-dotenv

      - name: Export Sheets → JSON
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python scripts/export_sheets_to_json.py

      - name: Commit JSON cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/json_questions/questions_db.json data/catalog.json data/lesson_index.json
          if git diff --cached --quiet; then
            echo 'Không có thay đổi — bỏ qua commit.'
          else
            git commit -m "Auto sync: export Sheets → JSON cache $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
